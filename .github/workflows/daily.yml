name: Daily edition

on:
  # GitHub starts scheduled runs late (1.5-2.5 h observed), so start well before
  # 08:00 KST to have the edition live by then. The second schedule is a retry
  # for days the first run fails; it skips itself if today's edition exists.
  schedule:
    - cron: "47 19 * * *"  # 04:47 KST -> usually published ~06:30-07:30
    - cron: "13 22 * * *"  # 07:13 KST retry (skipped when already published)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ghnews/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Skip a scheduled run if today's edition is already out
        run: |
          today="$(TZ=Asia/Seoul date +%F)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/$today.json" ]; then
            echo "Edition $today already published - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Collect and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m ghnews ${{ github.event_name == 'push' && '--no-fetch' || '' }}
      - name: Save edition data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "edition: $(TZ=Asia/Seoul date +%F)"
          # The branch may have moved since checkout (new commits, or a re-run of an
          # old run). Replay our data commit on top; on a clash keep today's fresh data.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
