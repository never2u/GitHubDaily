name: Daily edition

on:
  # The 08:00 KST edition is started by an external scheduler (cron-job.org)
  # calling workflow_dispatch at 07:55 KST; dispatches start within seconds.
  # GitHub's own schedule often starts hours late, so it is only a backup:
  # it skips itself when today's edition is already published.
  schedule:
    - cron: "47 22 * * *"  # 07:47 KST, usually runs ~09:30-10:30 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ghnews/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Skip the backup run if today's edition is already out
        run: |
          today="$(TZ=Asia/Seoul date +%F)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/$today.json" ]; then
            echo "Edition $today already published - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Collect and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m ghnews ${{ github.event_name == 'push' && '--no-fetch' || '' }}
      - name: Save edition data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "edition: $(TZ=Asia/Seoul date +%F)"
          # The branch may have moved since checkout (new commits, or a re-run of an
          # old run). Replay our data commit on top; on a clash keep today's fresh data.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
